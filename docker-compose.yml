services:
  mlflow:
    container_name: fraud-mlflow

    build:
      context: .
      dockerfile: Dockerfile.backend

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///app/mlflow.db
      --default-artifact-root /app/mlruns

    ports:
      - "5000:5000"

    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000

    volumes:
      - ./mlruns:/app/mlruns

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:5000').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    container_name: fraud-backend

    build:
      context: .
      dockerfile: Dockerfile.backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      mlflow:
        condition: service_healthy

    volumes:
      - ./mlruns:/app/mlruns

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/liveness').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    container_name: fraud-frontend

    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      FRAUD_BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8501').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s