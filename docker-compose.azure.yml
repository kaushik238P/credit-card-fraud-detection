services:
  backend:
    container_name: fraud-backend

    image: kaushik238.azurecr.io/fraud-backend:latest

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/liveness').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    container_name: fraud-frontend

    image: kaushik238.azurecr.io/fraud-frontend:latest

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      FRAUD_BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8501').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s