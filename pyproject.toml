[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.11.0",
    "numpy>=2.5.0",
    "pandas>=2.0.0,<3",
    "scikit-learn>=1.9.0",
    "protobuf<5",
    "catboost>=1.2.10",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.58.0",
]
training = [
    "xgboost>=3.3.0",
    "lightgbm>=4.6.0",
]

report = [
    "tabulate>=0.10.0",
    "markdown>=3.10.2",
]